.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .art{aspect-ratio:1;display:grid;place-items:center;padding:22px}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.card h3{font-size:1.25rem}
.card small{color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.price{font-weight:600}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:7px 16px;font-weight:600}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;margin:12px 0 26px}
.intro h1{font-size:2.2rem;margin-bottom:10px}
.intro p{margin:0;max-width:62ch;color:var(--muted)}
.page{max-width:680px;margin:12px 0 48px}
.page h1{font-size:2.2rem;margin-bottom:14px}
.page p{color:var(--muted);margin:0 0 14px}.page h3{font-size:1.2rem;margin:24px 0 6px}
.page p.lead{color:var(--ink);font-size:1.15rem}
footer{padding:24px 0 40px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:20;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.drawer.open{transform:none}
.drawer h2{font-size:1.8rem;margin-bottom:12px}
.close{align-self:flex-end;background:none;border:0;color:var(--ink);font-size:1.6rem;line-height:1}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink)}
.total{display:flex;justify-content:space-between;font-weight:600;padding:14px 0}
label{display:block;font-size:.9rem;margin:10px 0 4px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.msg{color:var(--muted);padding:14px 0}
.done{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px}
.err{color:#B3261E;font-size:.9rem;margin-top:8px}
@media (prefers-color-scheme:dark){.err{color:#F2B8B5}}
@media (max-width:720px){.hero{grid-template-columns:1fr}.heroart{max-width:280px}}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.tools{display:flex;gap:8px;align-items:center}.tool{background:none;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:999px;min-width:44px}

 {t:["কাস্টম অর্ডার","Custom orders"],p:["পছন্দের রং, সাইজ বা নকশায় গহনা বানিয়ে নেওয়া যায়। কাস্টম অর্ডারে সময় একটু বেশি লাগে এবং এগুলো ফেরত নেওয়া হয় না।","We can make a piece in your colour, size or design. Custom orders take a little longer and cannot be returned."]},
 {t:["গহনার যত্ন","Taking care of your jewellery"],p:["পানি, পারফিউম আর সরাসরি রোদ থেকে গহনা দূরে রাখুন। ব্যবহারের পর শুকনো কাপড়ে মুছে বাক্সে রাখুন। এতে অনেক দিন নতুন থাকবে।","Keep your jewellery away from water, perfume and direct sun. Wipe it with a dry cloth after wearing and store it in its box. This keeps it looking new for a long time."]},
 {t:["গোপনীয়তা","Privacy"],p:["আপনার নাম, ফোন নম্বর আর ঠিকানা শুধু অর্ডার পৌঁছে দিতে ব্যবহার করা হয়। এগুলো আমরা অন্য কারও সঙ্গে শেয়ার করি না।","Your name, phone number and address are used only to deliver your order. We do not share them with anyone else."]}
];
var L="bn",THEME="",$=function(i){return document.getElementById(i)};
try{L=localStorage.getItem("gb_lang")||"bn";THEME=localStorage.getItem("gb_theme")||""}catch(e){}
function s(k){return T[k][L==="bn"?0:1]}
function lg(a){return a[L==="bn"?0:1]}
function bn(n){return L==="bn"?String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]}):String(n)}
function tk(n){return "৳"+bn(n.toLocaleString("en-US"))}
function isDark(){return THEME?THEME==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches}
function applyTheme(){if(THEME)document.documentElement.setAttribute("data-theme",THEME);else document.documentElement.removeAttribute("data-theme");
  $("themeBtn").textContent=isDark()?"☀":"☾";$("themeBtn").setAttribute("aria-label",s("theme"));$("themeBtn").title=s("theme")}
function art(type,c){
  var q='<svg viewBox="0 0 100 100" width="100%" height="100%" fill="none" stroke="'+c+'" stroke-width="3" stroke-linecap="round" aria-hidden="true">';
  if(type==="Earrings") q+='<circle cx="34" cy="30" r="3"/><path d="M34 33v14"/><path d="M26 74q8-30 16 0z" fill="'+c+'" fill-opacity=".25"/><circle cx="66" cy="30" r="3"/><path d="M66 33v14"/><path d="M58 74q8-30 16 0z" fill="'+c+'" fill-opacity=".25"/>';
  else if(type==="Necklace") q+='<path d="M18 22q32 70 64 0"/><path d="M50 62v6"/><circle cx="50" cy="76" r="9" fill="'+c+'" fill-opacity=".25"/>';
  else if(type==="Rings") q+='<circle cx="50" cy="60" r="24"/><path d="M42 36l8-12 8 12z" fill="'+c+'" fill-opacity=".3"/>';
  else q+='<ellipse cx="50" cy="52" rx="34" ry="22"/><circle cx="16" cy="52" r="4" fill="'+c+'"/><circle cx="84" cy="52" r="4" fill="'+c+'"/><circle cx="50" cy="30" r="4" fill="'+c+'"/><circle cx="50" cy="74" r="4" fill="'+c+'"/><circle cx="26" cy="38" r="4" fill="'+c+'"/><circle cx="74" cy="38" r="4" fill="'+c+'"/><circle cx="26" cy="66" r="4" fill="'+c+'"/><circle cx="74" cy="66" r="4" fill="'+c+'"/>';
  return q+'</svg>';
}
var cart={};
var NAV=["home","resin","clay","jewellery","policy","about","contact"];
function card(p){return '<article class="card"><div class="art" style="background:'+p.color+'1F">'+art(p.type,p.color)+'</div><div class="body"><h3>'+lg(p.name)+'</h3><small>'+s(p.cat)+'</small><div class="row"><span class="price">'+tk(p.price)+'</span><button class="add" data-id="'+p.id+'">'+s("add")+'</button></div></div></article>'}
function route(top){
  var h=(location.hash||"#home").slice(1); if(NAV.indexOf(h)<0)h="home";
  $("nav").setAttribute("aria-label",s("menu"));
  $("nav").innerHTML=NAV.map(function(n){return '<a href="#'+n+'"'+(n===h?' aria-current="page"':'')+'>'+s(n)+'</a>'}).join("");
  var v="";
  if(h==="home"){
    v='<section class="hero"><div><h1>'+s("heroH")+'</h1><p>'+s("heroP")+'</p><a class="btn" href="#jewellery">'+s("heroBtn")+'</a></div><div class="heroart">'+art("Necklace","#B8893B")+'</div></section>'
    +'<h2 class="sec">'+s("byType")+'</h2><div class="tiles">'+Object.keys(CATS).map(function(k){return '<a class="tile" href="#'+k+'"><h3>'+s(k)+'</h3><span>'+lg(CATS[k].blurb)+'</span></a>'}).join("")+'</div>'
    +'<h2 class="sec">'+s("picks")+'</h2><div class="grid">'+[1,5,10,2].map(function(i){return card(PRODUCTS.filter(function(p){return p.id===i})[0])}).join("")+'</div>';
  } else if(CATS[h]){
    v='<section class="intro"><h1>'+s(h)+'</h1><p>'+lg(CATS[h].intro)+'</p></section><div class="grid">'+PRODUCTS.filter(function(p){return p.cat===h}).map(card).join("")+'</div>';
  } else if(h==="policy"){
    v='<section class="page"><h1>'+s("policy")+'</h1><p class="lead">'+s("polLead")+'</p>'+POLICY.map(function(x){return '<h3>'+lg(x.t)+'</h3><p>'+lg(x.p)+'</p>'}).join("")+'</section>';
  } else if(h==="about"){
    v='<section class="page"><h1>'+s("aboutH")+'</h1><p class="lead">'+s("about1")+'</p><p>'+s("about2")+'</p><p>'+s("about3")+'</p></section>';
  } else {
    v='<section class="page"><h1>'+s("contactH")+'</h1><p class="lead">'+s("contactLead")+'</p><p>'+s("phone")+PHONE_TEXT+'</p><p><a class="btn" href="https://wa.me/'+WHATSAPP+'" target="_blank" rel="noopener">'+s("wa")+'</a></p></section>';
  }
  $("view").innerHTML=v; if(top!==false)window.scrollTo(0,0);
  document.title=(h==="home"?"":s(h)+" | ")+"গহনাবিলাসী – Gohonabilashi";
}
function chrome(){
  document.documentElement.lang=L==="bn"?"bn":"en";
  $("langBtn").textContent=s("langBtn");$("footer").textContent=s("footer");
  $("cartTitle").textContent=s("cartTitle");$("closeCart").setAttribute("aria-label",s("closeCart"));
  applyTheme();
}
function lines(){return Object.keys(cart).map(function(id){var p=PRODUCTS.filter(function(x){return x.id==id})[0];return {p:p,q:cart[id]}})}
function sum(){return lines().reduce(function(a,l){return a+l.p.price*l.q},0)}
var doneHtml=null;
function renderCart(){
  var n=lines().reduce(function(a,l){return a+l.q},0);
  $("openCart").textContent=s("cart")+" ("+bn(n)+")";$("openCart").setAttribute("aria-label",s("cart"));
  var b=$("cartBody");
  if(doneHtml){b.innerHTML=doneHtml();return}
  if(!n){b.innerHTML='<p class="msg">'+s("empty")+'</p>';return}
  b.innerHTML=lines().map(function(l){return '<div class="item"><div><strong>'+lg(l.p.name)+'</strong><div class="qty"><button data-dec="'+l.p.id+'" aria-label="'+s("less")+'">−</button>'+bn(l.q)+'<button data-inc="'+l.p.id+'" aria-label="'+s("more")+'">+</button></div></div><div>'+tk(l.p.price*l.q)+'</div></div>'}).join("")
  +'<div class="total"><span>'+s("total")+'</span><span>'+tk(sum())+'</span></div>'
  +'<label for="nm">'+s("nameL")+'</label><input id="nm" autocomplete="name">'
  +'<label for="ph">'+s("phoneL")+'</label><input id="ph" type="tel" autocomplete="tel">'
  +'<label for="ad">'+s("addrL")+'</label><textarea id="ad" rows="3" autocomplete="street-address"></textarea>'
  +'<label for="nt">'+s("noteL")+'</label><input id="nt" placeholder="'+s("notePh")+'">'
  +'<p class="err" id="err" role="alert"></p>'
  +'<button class="btn" id="send" style="width:100%;margin-top:12px">'+s("send")+'</button>';
}
function openCart(o){$("drawer").classList.toggle("open",o);$("drawer").setAttribute("aria-hidden",!o)}
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.dataset.id){cart[t.dataset.id]=(cart[t.dataset.id]||0)+1;doneHtml=null;renderCart();t.textContent=s("added");setTimeout(function(){t.textContent=s("add")},900)}
  if(t.dataset.inc){cart[t.dataset.inc]++;renderCart()}
  if(t.dataset.dec){if(--cart[t.dataset.dec]<1)delete cart[t.dataset.dec];renderCart()}
  if(t.id==="openCart"){renderCart();openCart(true)}
  if(t.id==="closeCart")openCart(false);
  if(t.id==="langBtn"){L=L==="bn"?"en":"bn";try{localStorage.setItem("gb_lang",L)}catch(x){}chrome();route(false);renderCart()}
  if(t.id==="themeBtn"){THEME=isDark()?"light":"dark";try{localStorage.setItem("gb_theme",THEME)}catch(x){}applyTheme()}
  if(t.id==="send"){
    var nm=$("nm").value.trim(),ph=$("ph").value.trim(),ad=$("ad").value.trim();
    if(!nm||!ph||!ad){$("err").textContent=s("err");return}
    var note=$("nt").value,msgLang=L;
    var txt=s("newOrder")+"\n"+lines().map(function(l){return l.q+" x "+lg(l.p.name)+" - "+tk(l.p.price*l.q)}).join("\n")+"\n"+s("total")+": "+tk(sum())+"\n"+s("nameW")+": "+nm+"\n"+s("phoneW")+": "+ph+"\n"+s("addrW")+": "+ad+(note?"\n"+s("noteW")+": "+note:"");
    var url="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(txt);
    cart={};
    doneHtml=function(){return '<div class="done"><h3 style="font-size:1.6rem">'+s("almost")+'</h3><p>'+s("almostP")+'</p><a class="btn" href="'+url+'" target="_blank" rel="noopener">'+s("openWa")+'</a></div>'};
    renderCart();
  }
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")openCart(false)});
window.addEventListener("hashchange",function(){route()});
chrome();route();renderCart();
</script>
</body>
</html>
